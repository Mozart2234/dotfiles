# Herdr — terminal workspace manager for coding agents
# Reference: `herdr --default-config`  ·  Validate: `herdr config check`
# Reload without restart: `herdr server reload-config` (or prefix+shift+r)

onboarding = false

# ---------------------------------------------------------------------------
# Theme — mirrors ~/.config/ghostty/config (Catppuccin Mocha, always dark)
# ---------------------------------------------------------------------------
# Fixed dark flavor, no auto_switch: Ghostty is pinned to Mocha, so following the
# macOS appearance would render a light herdr UI on top of a dark terminal.
[theme]
name = "catppuccin"

# Naruto-inspired accents taken from Catppuccin's own palette (peach/red), so they
# stay comfortable for all-day use. Focused pane border = peach; "working" agents
# render in peach instead of yellow.
[theme.custom]
accent = "#fab387" # Mocha peach
yellow = "#fab387" # working state
red = "#f38ba8"    # blocked state (Mocha red)
# Let Ghostty's background (Uzumaki wallpaper + macOS glass) show through herdr.
panel_bg = "reset"

[terminal]
# Inherit the cwd of the pane/workspace a new pane is created from.
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
# Agent-detection manifests: keeps working/blocked/idle accurate as agent CLIs change.
manifest_check = true

# ---------------------------------------------------------------------------
# Session — restore agents into their native conversations after a restart.
# Requires the installed integration hook (see `herdr integration status`).
# ---------------------------------------------------------------------------
[session]
resume_agents_on_restore = true

# ---------------------------------------------------------------------------
# Keys — prefix is ctrl+s, matching the long-standing tmux muscle memory.
# Safe because tmux is no longer nested inside Herdr; nothing else claims ctrl+s.
# ---------------------------------------------------------------------------
[keys]
prefix = "ctrl+s"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces on
# machines that run skhd.
focus_agent = "prefix+ctrl+1..9"

# Back-and-forth between the last two panes.
last_pane = "prefix+space"

# Split naming that matches the visual result rather than the axis name.
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# ---------------------------------------------------------------------------
# UI — optimized for "which agent is blocked on me right now?"
# ---------------------------------------------------------------------------
[ui]
# Accent lives in [theme.custom] (Mocha, always dark).

# Attention queue instead of grouping by space: blocked agents float to the top.
agent_panel_sort = "priority"

# Show the detected agent in the pane border when the pane has no manual name.
show_agent_labels_on_pane_borders = true

sidebar_width = 30
sidebar_collapsed_mode = "compact"

# Create tabs immediately instead of prompting for a name.
prompt_new_tab_name = false

# "always" also frames a lone pane, so the accent border and its label stay visible.
pane_borders = "always"
pane_gaps = true

# Agent summary from the agent-pulse plugin (github.com/Mozart2234/herdr-agent-pulse), e.g. "🍥 2 · 🦊 1".
# herdr shows the last output line; the file is empty when no agent is active.
tab_bar_right = [
  { type = "command", command = "cat ~/.local/state/herdr/plugins/mozart2234.agent-pulse/summary.txt 2>/dev/null", interval_seconds = 1 },
]

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
# Claude Code reports its current activity in the terminal title — surface it.
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# Desktop notifications when a background agent finishes or gets blocked.
# "terminal" sends OSC 9 to Ghostty, which raises a native macOS notification
# (click focuses Ghostty). "system" would fall back to osascript without terminal-notifier.
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true
# Naruto clips (personal use, not versioned). Paths are relative to this file.
# Short, voiceless effects for all-day use; alternatives live in sounds/candidates/.
done_path = "sounds/done.mp3"       # shadow-clone smoke "poof" (1.2 s) when an agent finishes
request_path = "sounds/request.mp3" # Sharingan activation (2.0 s) when an agent needs you

# ---------------------------------------------------------------------------
# Experimental
# ---------------------------------------------------------------------------
[experimental]
# Keep recent pane screen history across full server restarts.
pane_history = true

[advanced]
# Agent sessions produce long transcripts; 10MB is the Ghostty-matching default.
scrollback_limit_bytes = 10000000
